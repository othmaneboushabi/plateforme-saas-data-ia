name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas_admin
          POSTGRES_PASSWORD: saas_password
          POSTGRES_DB: saas_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Installer le client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Appliquer le schéma (tables + Row-Level Security)
        env:
          PGPASSWORD: saas_password
        run: psql -h localhost -U saas_admin -d saas_platform -f infra/postgres/init.sql

      - name: Lancer les tests
        env:
          DATABASE_DSN: "host=localhost port=5432 dbname=saas_platform user=app_user password=app_password"
        run: pytest tests/ -v
